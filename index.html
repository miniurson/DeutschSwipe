<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0054A6">
<link rel="manifest" href="manifest.json">
<title>DeutschSwipe</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:#F5F5F5;color:#333;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:#0054A6;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
header .stats{font-size:13px;opacity:.9}
header button{background:none;border:0;color:#fff;font-size:22px}
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;position:relative}
#card{width:100%;max-width:460px;height:100%;max-height:560px;background:#fff;border-radius:20px;box-shadow:0 6px 24px #0003;padding:24px;display:flex;flex-direction:column;justify-content:center;overflow:auto;touch-action:none;user-select:none;position:relative}
#card .label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#0054A6;margin-bottom:10px}
#card .main{font-size:22px;font-weight:600;margin-bottom:18px;white-space:pre-line}
#card .sub{font-size:16px;color:#555;white-space:pre-line}
#card .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:#aaa}
#badge{position:absolute;top:20px;font-size:28px;font-weight:800;padding:4px 14px;border:4px solid;border-radius:10px;opacity:0;pointer-events:none}
#msg{text-align:center;color:#666;padding:20px;line-height:1.6}
#more{margin-top:16px;padding:12px 22px;border:0;border-radius:12px;background:#0054A6;color:#fff;font-size:16px}
.btns{display:flex;gap:10px;padding:10px 16px 18px;justify-content:center}
.btns button{flex:1;max-width:140px;padding:14px 0;border:0;border-radius:14px;font-size:16px;color:#fff}
.no{background:#d9534f}.ok{background:#2e9e5b}.easy{background:#0054A6}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,420px)}
dialog label{display:block;margin:12px 0 4px;font-size:14px}
dialog input,dialog select,dialog button{width:100%;padding:10px;font-size:16px;border-radius:8px;border:1px solid #ccc}
dialog button{background:#0054A6;color:#fff;border:0;margin-top:12px}
dialog button.sec{background:#eee;color:#333}
</style>
</head>
<body>
<header>
  <div><b>Fiszki</b><div class="stats" id="stats"></div></div>
  <button id="openSet">⚙️</button>
</header>
<div id="stage"><div id="msg">Ładowanie…</div></div>
<div class="btns">
  <button class="no" id="bNo">✗ Nie umiem</button>
  <button class="easy" id="bEasy">★ Łatwe</button>
  <button class="ok" id="bOk">✓ Umiem</button>
</div>

<dialog id="dlg">
  <h3 style="margin-top:0">Ustawienia</h3>
  <label>Kierunek</label>
  <select id="sDir">
    <option value="A">A: Bedeutung + Synonyme → Ausdruck + Beispiel</option>
    <option value="B">B: Ausdruck + Beispiel → Bedeutung + Synonyme</option>
  </select>
  <label>Tydzień (Woche)</label>
  <select id="sWeek"></select>
  <label>Nowe fiszki dziennie</label>
  <input type="number" id="sNew" min="0">
  <label>Powtórki dziennie (0 = bez limitu)</label>
  <input type="number" id="sRev" min="0">
  <button id="bImport">📥 Importuj Excel (.xlsx)</button>
  <input type="file" id="file" accept=".xlsx,.xls" hidden>
  <button id="bClose" class="sec">Zamknij</button>
  <p id="impMsg" style="font-size:13px;color:#555"></p>
</dialog>

<script src="xlsx.full.min.js"></script>
<script>
/* ---------- Algorytm (styl Anki) ---------- */
const DAY=864e5, RELEARN=10*60e3, MASTER_INT=180, STREAK_MASTER=5;
const newP=()=>({state:'NEW',ease:2.5,interval:0,streak:0,lapses:0,due:0});
function mastered(p,now){return {...p,state:'MASTERED',streak:STREAK_MASTER,interval:MASTER_INT,due:now+MASTER_INT*DAY}}
function answer(p,swipe,now=Date.now()){
  if(swipe==='left') return {...p,state:'LEARNING',ease:Math.max(1.3,p.ease-0.2),interval:1,streak:0,lapses:p.lapses+1,due:now+RELEARN};
  if(swipe==='up') return mastered(p,now);
  const streak=p.streak+1;
  if(streak>=STREAK_MASTER) return mastered({...p,streak},now);
  const interval = streak===1?1 : streak===2?3 : Math.max(p.interval+1,Math.round(p.interval*p.ease));
  return {...p,state:'REVIEW',streak,interval,due:now+interval*DAY};
}

/* ---------- IndexedDB ---------- */
let db;
const openDB=()=>new Promise((res,rej)=>{const q=indexedDB.open('fiszki',1);
  q.onupgradeneeded=()=>q.result.createObjectStore('cards',{keyPath:'expression'});
  q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const getAll=()=>new Promise(r=>{const q=db.transaction('cards').objectStore('cards').getAll();q.onsuccess=()=>r(q.result)});
const putMany=list=>new Promise(r=>{const t=db.transaction('cards','readwrite');const s=t.objectStore('cards');list.forEach(c=>s.put(c));t.oncomplete=r});

/* ---------- Ustawienia i liczniki dzienne ---------- */
const S=Object.assign({dir:'A',week:'all',maxNew:10,maxRev:100},JSON.parse(localStorage.getItem('settings')||'{}'));
const saveS=()=>localStorage.setItem('settings',JSON.stringify(S));
function daily(){
  const k=new Date().toDateString();
  let d=JSON.parse(localStorage.getItem('daily')||'{}');
  if(d.day!==k) d={day:k,n:0,r:0};
  return d;
}
const saveD=d=>localStorage.setItem('daily',JSON.stringify(d));

/* ---------- Kolejka ---------- */
let cards=[], current=null;
function pick(){
  const now=Date.now(), d=daily();
  const list=cards.filter(c=>S.week==='all'||String(c.week)===S.week);
  const due=list.filter(c=>{const p=c.p[S.dir];return p.state!=='NEW'&&p.due<=now});
  const learn=due.filter(c=>c.p[S.dir].state==='LEARNING');
  const rev=due.filter(c=>c.p[S.dir].state!=='LEARNING')
    .sort((a,b)=>a.p[S.dir].due-b.p[S.dir].due).slice(0,S.maxRev===0?Infinity:Math.max(0,S.maxRev-d.r));
  const cand=learn.concat(rev).sort((a,b)=>a.p[S.dir].due-b.p[S.dir].due);
  const newLeft=Math.max(0,S.maxNew-d.n);
  const fresh=list.filter(c=>c.p[S.dir].state==='NEW').sort((a,b)=>a.week-b.week||a.added-b.added);
  document.getElementById('stats').textContent=
    `do powtórki: ${cand.length} · nowe: ${Math.min(newLeft,fresh.length)} · łącznie fiszek: ${list.length}`;
  if(cand.length) return cand[0];
  if(newLeft>0&&fresh.length) return fresh[0];
  return null;
}

/* ---------- Rysowanie karty ---------- */
const stage=document.getElementById('stage');
const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
let flipped=false, cardEl;
function faces(c){
  const A=[['Znaczenie',c.meaning],['Synonimy',c.synonyms]];
  const B=[['Ausdruck',c.expression],['Beispiel',c.example]];
  return S.dir==='A'?{front:A,back:B}:{front:B,back:A};
}
function renderFace(){
  const f=faces(current)[flipped?'back':'front'];
  cardEl.innerHTML=`<div id="badge"></div>
    <div class="label">${f[0][0]}</div><div class="main">${esc(f[0][1])}</div>
    <div class="label">${f[1][0]}</div><div class="sub">${esc(f[1][1])}</div>
    <div class="hint">${flipped?'przesuń: ← nie umiem · → umiem · ↑ łatwe':'dotknij, aby odwrócić'}</div>`;
}

let practice=false, queue=[];
function startPractice(){
  const q=cards.filter(c=>(S.week==='all'||String(c.week)===S.week)
    && ['LEARNING','REVIEW'].includes(c.p[S.dir].state));
  if(!q.length){alert('Brak fiszek do ćwiczenia.');return}
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}
  queue=q; practice=true; show();
}

function show(){
  current=practice?(queue.shift()||null):pick();
  flipped=false;
  if(practice) document.getElementById('stats').textContent=`ćwiczenie na zapas · zostało: ${queue.length+(current?1:0)}`;
  if(!current){
    practice=false;
    const next=cards.filter(c=>S.week==='all'||String(c.week)===S.week)
      .map(c=>c.p[S.dir]).filter(p=>p.state!=='NEW').map(p=>p.due).sort((a,b)=>a-b)[0];
    stage.innerHTML=`<div id="msg">${cards.length?'🎉 Na dziś koniec!':'Brak fiszek. Otwórz ⚙️ i zaimportuj plik Excel.'}
      ${next?`<br>Następna powtórka: ${new Date(next).toLocaleString('pl-PL')}`:''}
      ${cards.length?'<br><button id="more">Ćwicz dalej</button>':''}</div>`;
    const b=document.getElementById('more'); if(b) b.addEventListener('click',startPractice);
    pick(); // odświeża statystyki
    return;
  }
  stage.innerHTML='<div id="card"></div>';
  cardEl=document.getElementById('card');
  renderFace(); attachSwipe();
}

/* ---------- Gesty ---------- */
function attachSwipe(){
  let sx,sy,dx=0,dy=0,drag=false;
  cardEl.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;dx=dy=0;cardEl.setPointerCapture(e.pointerId);cardEl.style.transition='none'});
  cardEl.addEventListener('pointermove',e=>{
    if(!drag)return; dx=e.clientX-sx; dy=e.clientY-sy;
    cardEl.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/20}deg)`;
    const b=document.getElementById('badge'); if(!b)return;
    const up=dy<-40&&Math.abs(dy)>Math.abs(dx);
    if(up){b.textContent='ŁATWE';b.style.color='#0054A6';b.style.left='30%';b.style.opacity=Math.min(1,-dy/120)}
    else if(dx>20){b.textContent='UMIEM';b.style.color='#2e9e5b';b.style.left='20px';b.style.opacity=Math.min(1,dx/120)}
    else if(dx<-20){b.textContent='NIE UMIEM';b.style.color='#d9534f';b.style.left='';b.style.right='20px';b.style.opacity=Math.min(1,-dx/120)}
    else b.style.opacity=0;
  });
  cardEl.addEventListener('pointerup',()=>{
    if(!drag)return; drag=false;
    const moved=Math.hypot(dx,dy);
    if(moved<8){cardEl.style.transform='';flipped=!flipped;renderFace();return}
    if(dy<-110&&Math.abs(dy)>Math.abs(dx)) return fly('up');
    if(dx>110) return fly('right');
    if(dx<-110) return fly('left');
    cardEl.style.transition='transform .2s';cardEl.style.transform='';
    const b=document.getElementById('badge'); if(b)b.style.opacity=0;
  });
}
function fly(dir){
  const t={left:'translate(-150vw,0) rotate(-30deg)',right:'translate(150vw,0) rotate(30deg)',up:'translate(0,-150vh)'}[dir];
  cardEl.style.transition='transform .25s';cardEl.style.transform=t;
  setTimeout(()=>commit(dir),220);
}
async function commit(dir){
  if(!current)return;
  const old=current.p[S.dir];
  if(practice){
    // wariant A: tylko "nie umiem" (lewo) i "łatwe" (góra) zmieniają harmonogram; "umiem" nic nie zmienia
    if(dir!=='right'){ current.p[S.dir]=answer(old,dir); await putMany([current]); }
  } else {
    const d=daily();
    if(old.state==='NEW') d.n++; else d.r++;
    saveD(d);
    current.p[S.dir]=answer(old,dir);
    await putMany([current]);
  }
  show();
}
const act=dir=>()=>{if(current&&cardEl)fly(dir)};
bNo.onclick=act('left'); bOk.onclick=act('right'); bEasy.onclick=act('up');

/* ---------- Import Excela ---------- */
file.onchange=async()=>{
  const f=file.files[0]; if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    const map=new Map(cards.map(c=>[c.expression,c]));
    let added=0,updated=0,out=[];
    rows.slice(1).forEach((r,i)=>{
      const expression=String(r[1]).trim(); if(!expression)return;
      const old=map.get(expression);
      const c={expression,week:Number(r[0])||0,meaning:String(r[2]).trim(),
        synonyms:String(r[3]).trim(),example:String(r[4]).trim(),
        p:old?old.p:{A:newP(),B:newP()}, added:old?old.added:Date.now()+i};
      old?updated++:added++; map.set(expression,c); out.push(c);
    });
    await putMany(out);
    cards=[...map.values()];
    impMsg.textContent=`Dodano: ${added}, zaktualizowano: ${updated}.`;
    fillWeeks(); show();
  }catch(e){impMsg.textContent='Błąd importu: '+e.message}
  file.value='';
};
bImport.onclick=()=>file.click();

/* ---------- Ustawienia UI ---------- */
function fillWeeks(){
  const w=[...new Set(cards.map(c=>c.week))].sort((a,b)=>a-b);
  sWeek.innerHTML='<option value="all">Wszystkie</option>'+w.map(x=>`<option value="${x}">#${x}</option>`).join('');
  sWeek.value=w.map(String).includes(S.week)?S.week:'all'; S.week=sWeek.value;
}
openSet.onclick=()=>{sDir.value=S.dir;sNew.value=S.maxNew;sRev.value=S.maxRev;dlg.showModal()};
bClose.onclick=()=>{
  S.dir=sDir.value;S.week=sWeek.value;S.maxNew=+sNew.value||0;S.maxRev=+sRev.value||0;
  saveS();dlg.close();show();
};

/* ---------- Start ---------- */
(async()=>{
  db=await openDB(); cards=await getAll(); fillWeeks(); show();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();
})();
</script>
</body>
</html>
